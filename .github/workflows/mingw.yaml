# separate terms of service, privacy policy, and support
# documentation.

name: MinGW

on:
  push:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Use Nix
      # You may pin to the exact commit or the version.
      # uses: aldoborrero/use-nix-action@2e52fec86f4d463a27615bd4a1551dd38bda361e
      uses: spotdemo4/nix-init@v1.0.0
      
    - name: command-action
      uses: github/command@v2.0.3
      with:
        command: nix --extra-experimental-features "nix-command flakes" develop .#build
