name: MinGW

on:
  push:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      name: clone
      with:
        submodules: recursive

      # wheeze
    - name: Free Disk Space (Ubuntu)
      # You may pin to the exact commit or the version.
      # uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      uses: jlumbroso/free-disk-space@v1.3.1

    - name: disk check 1
      run: "df -h"
        
    - name: init nix
      # You may pin to the exact commit or the version.
      # uses: aldoborrero/use-nix-action@2e52fec86f4d463a27615bd4a1551dd38bda361e
      uses: spotdemo4/nix-init@v1.0.0

    - name: disk check 2
      run: "df -h"
    
    - name: build
      run: "nix --extra-experimental-features 'nix-command flakes' develop .#build --command true"

    - name: zip
      run: "zip output.zip output/Release/bin/*"
    
    - name: upload
      shell: bash
      run: "curl -X PUT -H 'PW: $CI_UPLOAD_TOKEN' --data-binary @output.zip https://cdn.owdev.wiki/ci/prometheus/$GITHUB_REF_NAME/prometheus-$(date -u +'%Y-%m-%dT%H:%M:%S')-${GITHUB_SHA::7}.zip"
      env: # Or as an environment variable
        CI_UPLOAD_TOKEN: ${{ secrets.CI_UPLOAD_TOKEN }}
